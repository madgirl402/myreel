<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seamless Instagram Reels Loop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: white; font-family: -apple-system, sans-serif; height: 100vh; overflow: hidden; }
        
        /* Magic Rainbow Canvas */
        #magicCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }

        /* Reels Container */
        .reels-container { 
            height: 100vh; 
            overflow-y: scroll; 
            scroll-snap-type: y mandatory; 
            scrollbar-width: none; 
            position: relative;
        }
        .reels-container::-webkit-scrollbar { display: none; }
        
        .reel { 
            position: relative; 
            height: 100vh; 
            width: 100%;
            scroll-snap-align: start; 
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        video { width: 100%; height: 100%; object-fit: cover; }

        /* Sidebar UI */
        .side-bar { position: absolute; right: 12px; bottom: 110px; display: flex; flex-direction: column; gap: 20px; z-index: 10; }
        .icon-btn { cursor: pointer; text-align: center; }
        .icon-btn i { font-size: 30px; text-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        .liked { color: #ff3040 !important; }

        /* Info Overlay */
        .info-overlay { position: absolute; bottom: 35px; left: 15px; z-index: 10; width: 80%; }
        .user-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .username { font-weight: bold; font-size: 14px; }
        .follow-btn { border: 1px solid #fff; background: none; color: #fff; padding: 4px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .following { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

<canvas id="magicCanvas"></canvas>

<div class="reels-container" id="reelBox">
    <div class="reel" data-id="1">
        <video src="https://assets.mixkit.co/videos/preview/mixkit-young-couple-walking-in-a-park-together-41006-large.mp4" loop autoplay muted playsinline></video>
        <div class="side-bar">
            <div class="icon-btn" onclick="this.querySelector('i').classList.toggle('liked')"><i class="fas fa-heart"></i><p>1.2M</p></div>
            <div class="icon-btn"><i class="fas fa-comment"></i><p>420</p></div>
            <div class="icon-btn"><i class="fas fa-paper-plane"></i></div>
        </div>
        <div class="info-overlay">
            <div class="user-row">
                <span class="username">Made_Girl</span>
                <button class="follow-btn" onclick="this.innerText='Following'; this.classList.add('following')">Follow</button>
            </div>
            <p>Waiting for my future husband ❤️</p>
        </div>
    </div>

    <div class="reel" data-id="2">
        <video src="https://assets.mixkit.co/videos/preview/mixkit-couple-walking-holding-hands-in-the-park-41008-large.mp4" loop autoplay muted playsinline></video>
        <div class="side-bar">
            <div class="icon-btn" onclick="this.querySelector('i').classList.toggle('liked')"><i class="fas fa-heart"></i><p>850K</p></div>
            <div class="icon-btn"><i class="fas fa-comment"></i><p>900</p></div>
            <div class="icon-btn"><i class="fas fa-paper-plane"></i></div>
        </div>
        <div class="info-overlay">
            <div class="user-row">
                <span class="username">My_Boys</span>
                <button class="follow-btn" onclick="this.innerText='Following'; this.classList.add('following')">Follow</button>
            </div>
            <p>Future wife goals 💍✨</p>
        </div>
    </div>

    <div class="reel" data-id="3">
        <video src="https://assets.mixkit.co/videos/preview/mixkit-close-up-of-a-happy-couple-in-love-41005-large.mp4" loop autoplay muted playsinline></video>
        <div class="side-bar">
            <div class="icon-btn" onclick="this.querySelector('i').classList.toggle('liked')"><i class="fas fa-heart"></i><p>2M</p></div>
            <div class="icon-btn"><i class="fas fa-comment"></i><p>5K</p></div>
            <div class="icon-btn"><i class="fas fa-paper-plane"></i></div>
        </div>
        <div class="info-overlay">
            <div class="user-row">
                <span class="username">#Girls</span>
                <button class="follow-btn" onclick="this.innerText='Following'; this.classList.add('following')">Follow</button>
            </div>
            <p>Soulmate found ❤️ #HusbandWife</p>
        </div>
    </div>
</div>

<script>
    const reelBox = document.getElementById('reelBox');
    
    // सर्कुलर लूप बनाने के लिए पहली और आखिरी रील को क्लोन करना
    const firstReel = reelBox.firstElementChild.cloneNode(true);
    const lastReel = reelBox.lastElementChild.cloneNode(true);
    
    reelBox.appendChild(firstReel); // अंत में पहली रील जोड़ी
    reelBox.insertBefore(lastReel, reelBox.firstElementChild); // शुरुआत में आखिरी रील जोड़ी

    // शुरुआत को असली पहली रील पर सेट करना
    reelBox.scrollTop = window.innerHeight;

    reelBox.addEventListener('scroll', () => {
        const top = reelBox.scrollTop;
        const height = window.innerHeight;
        const totalHeight = reelBox.scrollHeight;

        // यदि एकदम ऊपर पहुँच जाएँ (Clone पर), तो चुपके से असली रील 3 पर कूदें
        if (top <= 0) {
            reelBox.scrollTop = totalHeight - (2 * height);
        }
        // यदि एकदम नीचे पहुँच जाएँ (Clone पर), तो चुपके से असली रील 1 पर कूदें
        if (top >= totalHeight - height) {
            reelBox.scrollTop = height;
        }
    });

    // --- Rainbow Magic Wave Logic ---
    const canvas = document.getElementById('magicCanvas');
    const ctx = canvas.getContext('2d');
    let points = [];

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    function handleMove(e) {
        const x = e.touches ? e.touches[0].clientX : e.clientX;
        const y = e.touches ? e.touches[0].clientY : e.clientY;
        for(let i=0; i<3; i++) points.push({x, y, size: 12, color: `hsla(${Math.random()*360}, 100%, 50%, 0.7)`, life: 1});
    }
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('touchmove', handleMove);

    function draw() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        points.forEach((p, i) => {
            p.life -= 0.02; p.size -= 0.1;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.fill();
            if(p.life <= 0) points.splice(i, 1);
        });
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
