<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>My Reels - Mobile Only</title>
  <style>
    body, html { margin:0; padding:0; height:100%; overflow:hidden; background:#000; font-family:sans-serif; }
    .reels-container { height:100vh; overflow-y:scroll; scroll-snap-type:y mandatory; scroll-behavior:smooth; }
    .reel { height:100vh; width:100vw; position:relative; scroll-snap-align:start; display:flex; align-items:center; justify-content:center; }
    video { width:100%; height:100%; object-fit:cover; }
    .overlay { position:absolute; bottom:10%; left:5%; color:#fff; pointer-events:none; text-shadow:0 0 5px #000; }
    .actions { position:absolute; right:5%; bottom:20%; display:flex; flex-direction:column; gap:30px; }
    .actions button { background:rgba(0,0,0,0.6); border:none; color:#fff; font-size:35px; padding:15px; border-radius:50%; cursor:pointer; pointer-events:auto; }
    .loading { position:absolute; top:50%; left:50%; color:#fff; font-size:20px; transform:translate(-50%,-50%); }
  </style>
</head>
<body>
  <div class="reels-container" id="reels">
    <!-- JS se reels add honge -->
  </div>

  <script>
    const reelsContainer = document.getElementById('reels');
    const videoUrls = [
      "https://example.com/reel1.mp4",  // Apne real MP4 links daal do (short videos best)
      "https://example.com/reel2.mp4",
      "https://example.com/reel3.mp4",
      // 10–20+ add kar sakte ho, baad mein aur push kar sakte ho
      // Example free test: "https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_1mb.mp4"
    ];

    let currentIndex = 0;
    const batchSize = 5; // Har baar 5 load karo

    function loadReels(start) {
      for (let i = start; i < start + batchSize && i < videoUrls.length; i++) {
        const reelDiv = document.createElement('div');
        reelDiv.className = 'reel';

        const video = document.createElement('video');
        video.src = videoUrls[i];
        video.loop = true;
        video.muted = true; // Mobile pe autoplay ke liye muted zaroori
        video.playsInline = true;
        video.setAttribute('preload', 'none'); // Lazy load

        const overlay = document.createElement('div');
        overlay.className = 'overlay';
        overlay.innerHTML = `<div>@ranveer • Reel ${i+1}</div>`;

        const actions = document.createElement('div');
        actions.className = 'actions';
        actions.innerHTML = `<button>❤️</button><button>💬</button><button>↗️</button>`;

        reelDiv.appendChild(video);
        reelDiv.appendChild(overlay);
        reelDiv.appendChild(actions);
        reelsContainer.appendChild(reelDiv);

        // Observer for play/pause
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              video.play().catch(() => {}); // Mobile autoplay allow
            } else {
              video.pause();
            }
          });
        }, { threshold: 0.6 });

        observer.observe(video);
      }
    }

    // Shuru ke 5-10 load karo
    loadReels(0);

    // Infinite scroll: Jab last reel visible ho, next batch load
    const lastReelObserver = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && currentIndex < videoUrls.length) {
        currentIndex += batchSize;
        loadReels(currentIndex);
      }
    }, { threshold: 0.1 });

    // Last reel ko observe karo (dynamically update)
    function observeLast() {
      const lastReel = reelsContainer.lastElementChild?.querySelector('video');
      if (lastReel) lastReelObserver.observe(lastReel);
    }

    // Har load ke baad last observe
    const mutationObserver = new MutationObserver(observeLast);
    mutationObserver.observe(reelsContainer, { childList: true });

    observeLast(); // Pehli baar
  </script>
</body>
</html>
